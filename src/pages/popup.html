<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="extName">Youtube Focus</title>
    <link rel="stylesheet" href="pages.css" />
    <style>
      body {
        width: 280px;
        padding: 16px;
      }
      .card {
        padding: 0;
        border: 0;
        background: transparent;
      }
      h1 {
        font-size: 16px;
      }
      .row {
        flex-direction: column;
        gap: 8px;
        margin-top: 16px;
      }
      button,
      .button {
        width: 100%;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 data-i18n="extName">Youtube Focus</h1>
      <p id="state">—</p>
      <div class="row">
        <a
          id="planned"
          class="button primary"
          href="#"
          target="_blank"
          rel="noreferrer"
          data-i18n="actionOpenPlanned"
        >
          Open planned list
        </a>
        <button id="snooze" type="button" data-i18n="actionSnooze">Pause for 15 minutes</button>
        <button id="options" type="button" data-i18n="actionOptions">Settings</button>
      </div>
    </main>
    <script src="../common/settings.js"></script>
    <script src="../common/i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
