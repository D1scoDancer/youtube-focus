<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="optionsTitle">Youtube Focus settings</title>
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <main class="card">
      <h1 data-i18n="extName">Youtube Focus</h1>
      <p data-i18n="tagline">
        Less feed, zero Shorts, and only what you planned to watch.
      </p>

      <h2 data-i18n="sectionLanguage">Language</h2>
      <label>
        <span style="width: 100%">
          <span data-i18n="languageLabel">Interface language</span>
          <small data-i18n="languageHint">
            By default the extension follows the Chrome interface language.
          </small>
          <select id="language"></select>
        </span>
      </label>

      <h2 data-i18n="sectionHome">Home page</h2>
      <label>
        <input type="radio" name="homeMode" value="showcase" />
        <span>
          <span data-i18n="homeShowcase">Showcase without playback</span>
          <small data-i18n="homeShowcaseHint">
            The feed stays visible, but clicking a video does nothing. The native
            Watch later button on the thumbnail still works — that is how you
            fill the plan.
          </small>
        </span>
      </label>
      <label>
        <input type="radio" name="homeMode" value="redirect" />
        <span>
          <span data-i18n="homeRedirect">Go straight to the plan</span>
          <small data-i18n="homeRedirectHint">
            youtube.com is replaced with your planned list.
          </small>
        </span>
      </label>

      <h2 data-i18n="sectionPlanned">Planned list</h2>
      <label>
        <span style="width: 100%">
          <span data-i18n="plannedLabel">Plan address</span>
          <small data-i18n="plannedHint">
            Defaults to the native Watch later playlist. Must point to
            youtube.com and have a non-empty path.
          </small>
          <input id="plannedUrl" type="url" spellcheck="false" />
        </span>
      </label>

      <h2 data-i18n="sectionShorts">Shorts</h2>
      <label>
        <input type="radio" name="shortsMode" value="block" />
        <span>
          <span data-i18n="shortsBlock">Hide and block playback</span>
          <small data-i18n="shortsBlockHint">
            Opening /shorts/… shows the extension stub.
          </small>
        </span>
      </label>
      <label>
        <input type="radio" name="shortsMode" value="hide" />
        <span>
          <span data-i18n="shortsHide">Hide only</span>
          <small data-i18n="shortsHideHint">
            A direct link to Shorts keeps working.
          </small>
        </span>
      </label>

      <h2 data-i18n="sectionWatch">Video page</h2>
      <label>
        <input id="hideWatchSidebar" type="checkbox" />
        <span>
          <span data-i18n="hideSidebar">Hide recommendations on the right</span>
          <small data-i18n="hideSidebarHint">
            Also removes end screens on top of the player. The player itself does
            not move.
          </small>
        </span>
      </label>
      <label>
        <input id="hideComments" type="checkbox" />
        <span data-i18n="hideComments">Hide comments</span>
      </label>

      <h2 data-i18n="sectionOther">Other</h2>
      <label>
        <input id="showToast" type="checkbox" />
        <span>
          <span data-i18n="showToast">Show a hint on a dead click</span>
          <small data-i18n="showToastHint">
            Otherwise a click in the feed just looks like a broken site.
          </small>
        </span>
      </label>
      <label>
        <input id="enabled" type="checkbox" />
        <span data-i18n="enabledLabel">Extension enabled</span>
      </label>

      <div class="row">
        <button id="save" class="primary" type="button" data-i18n="actionSave">Save</button>
        <button id="reset" type="button" data-i18n="actionReset">Reset settings</button>
      </div>
      <div id="status" class="status" role="status"></div>
    </main>
    <script src="../common/settings.js"></script>
    <script src="../common/i18n.js"></script>
    <script src="options.js"></script>
  </body>
</html>
